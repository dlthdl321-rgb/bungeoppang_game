# 테스트 태그 (2026-11-23 안정화). 전체 실행(`flutter test`)에는 모두 포함된다.
# 빠른 확인: flutter test --exclude-tags slow            (약 20분 걸리는 시뮬레이션 등 제외)
# 화면 외 확인: flutter test --exclude-tags "slow||golden"
tags:
  golden:
    description: 기준 이미지(test/goldens) 비교가 들어 있는 파일. 기준 이미지는 사용자 확인 뒤에만 다시 만든다.
  slow:
    description: 1분 이상 걸리는 시뮬레이션·종단 테스트(workshop_progression_simulation 약 20분).
