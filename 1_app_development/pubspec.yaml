name: todays_bungeoppang
description: 오늘의 붕어빵 - 오프라인 모바일 클리커 시제품
publish_to: none
# 버전 규칙(23번 6단계): 이름+번호. 번호(versionCode)는 Play에 올릴 때마다 +1, 한 번 쓴 번호는 다시 못 쓴다.
# 이름(versionName)은 가출시 동안 0.1.x(고친 빌드마다 x+1), 정식 출시는 1.0.0. 예: 0.1.0+1 → 0.1.1+2 → 0.1.2+3.
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  share_plus: 12.0.2
  audioplayers: 6.8.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_functions: ^6.5.0
  in_app_purchase: ^3.3.1
  kakao_flutter_sdk_user: ^2.0.1
  firebase_app_check: ^0.4.9
  # 26번 5단계(DEC-045·046): 사용 통계는 Firebase Analytics만. 광고 ID·SSAID·개인화 광고 신호는
  # AndroidManifest에서 끈다. firebase_core 4.15.x와 맞는 12.x 마지막 안정판으로 고정.
  firebase_analytics: 12.6.1
  # 26번 5-1단계: 손님 도착 기기 안 예약 알림(서버 푸시·Firebase 메시징 아님). 시각은 UTC로만 넘긴다.
  flutter_local_notifications: 22.3.3
  timezone: 0.11.2
  # 26번 2-1단계: Google 로그인(계정 선택 → Firebase Auth Google 공급자). 로그인만, 광고·분석 없음.
  google_sign_in: 7.2.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.4

flutter:
  uses-material-design: true
  # Rounded Korean display font like the concept UI (SIL OFL 1.1,
  # assets/fonts/Jua-OFL.txt). BungeoSymbols: the punctuation Jua lacks, cut from
  # Noto Sans KR by tools/build_symbol_font.py (SIL OFL 1.1, BungeoSymbols-OFL.txt).
  fonts:
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
    - family: BungeoSymbols
      fonts:
        - asset: assets/fonts/BungeoSymbols-Regular.ttf
  # Synthesized by tools/generate_sounds.py (CC0 1.0); see README.
  assets:
    - config/development_balance.json
    # 26번 2-1단계: 사장님 이름 글자 수·비속어 목록, 앱 안에서 보는 약관·개인정보처리방침.
    - config/owner_name_rules.json
    - assets/legal/
    - assets/audio/
    # Pixel art from tools/draw_pixel_assets.py (see docs/pixel_art_prompts.md).
    - assets/images/fish/
    - assets/images/bg/
    - assets/images/stall/
    - assets/images/stove/
    # Drawn empty griddles and the stoves' baked fish alone
    # (tools/apply_25_art.py, 25번 필요한 그림 1번).
    - assets/images/stove_empty/
    - assets/images/stove_fish/
    # Closed (cold) and open (lid up) griddles, 26번 4-2단계 F8
    # (tools/apply_26_stoves.py, 25번 필요한 그림 7번).
    - assets/images/stove_closed/
    - assets/images/stove_open/
    - assets/images/icons/
    - assets/images/topping/
    - assets/images/skills/
    # Extra art from 이미지/이미지 raw via tools/pixelize.py (stage 14).
    - assets/images/fx/
    - assets/images/event/
    - assets/images/ui/
    - assets/images/cook/
    # Stall decorations from 3.3_additional_character_and_background_images (tools/apply_extra_art.py).
    - assets/images/deco/
    # Vendor parts cut from the concept sheets (tools/concept_avatar.py).
    - assets/images/avatar/girl/
    - assets/images/avatar/boy/
    # 26번 4-7단계: the vendor from a bare base (tools/avatar_v2.py).
    - assets/images/avatar_v2/girl/
    - assets/images/avatar_v2/boy/
    # Eye and mouth frames laid over the vendor's face (tools/avatar_layers.py).
    - assets/images/parts/
    # Home stage: mold-free backgrounds and the big mold (tools/make_home_stage_art.py).
    - assets/images/bg_clean/
    - assets/images/mold/
    # 26번 4-1단계: the stall lowered to the towel and the guests standing
    # at it (tools/apply_26_home_art.py, 25번 필요한 그림 20번·6번).
    - assets/images/bg_low/
    - assets/images/customer/
    # 26번 4-5단계: wardrobe item icons (tools/make_cosmetic_icons.py
    # temporary ones until 25번 필요한 그림 31번).
    - assets/images/cosmetic_icons/
