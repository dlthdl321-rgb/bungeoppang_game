# 자동 검사 (28번 7절, 2026-11-24)
# main·dev/stabilization에 올리거나 PR을 열 때 앱 분석·빠른 테스트와 서버 테스트를 돌린다.
# 저장소가 공개라 GitHub Actions 실행 시간은 무료다. 그림 폴더(약 2GB)는 받지 않는다.
name: 앱·서버 검사

on:
  push:
    branches: [main, dev/stabilization]
  pull_request:
    branches: [main, dev/stabilization]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: 앱 분석·테스트 (느린 것 제외)
    # 기준 이미지(test/goldens)가 Windows에서 만들어졌으므로 Windows에서 비교한다.
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: 1_app_development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            1_app_development
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # cooking_paint_test·generated_config_sync_test가 생성 도구 --check를 실행한다.
      - run: python -m pip install numpy pillow
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --exclude-tags slow
        env:
          PYTHONIOENCODING: utf-8
      - name: 기준 이미지가 다르면 비교 그림 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: 1_app_development/test/failures/
          if-no-files-found: ignore

  server:
    name: 서버 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 1_app_development/firebase/functions
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            1_app_development/firebase/functions
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 1_app_development/firebase/functions/package-lock.json
      - run: npm ci
      - run: npm test
