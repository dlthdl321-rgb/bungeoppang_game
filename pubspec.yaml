name: todays_bungeoppang
description: 오늘의 붕어빵 - 오프라인 모바일 클리커 시제품
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  share_plus: 12.0.2
  audioplayers: 6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Synthesized by tools/generate_sounds.py (CC0 1.0); see README.
  assets:
    - assets/audio/
    # Pixel art from tools/draw_pixel_assets.py (see docs/pixel_art_prompts.md).
    - assets/images/fish/
    - assets/images/bg/
    - assets/images/stall/
    - assets/images/stove/
    - assets/images/deco/
    - assets/images/icons/
