name: todays_bungeoppang
description: 오늘의 붕어빵 - 오프라인 모바일 클리커 시제품
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  share_plus: 12.0.2
  audioplayers: 6.8.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_functions: ^6.5.0
  in_app_purchase: ^3.3.1
  kakao_flutter_sdk_user: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Rounded Korean display font like the concept UI (SIL OFL 1.1,
  # assets/fonts/Jua-OFL.txt).
  fonts:
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
  # Synthesized by tools/generate_sounds.py (CC0 1.0); see README.
  assets:
    - assets/audio/
    # Pixel art from tools/draw_pixel_assets.py (see docs/pixel_art_prompts.md).
    - assets/images/fish/
    - assets/images/bg/
    - assets/images/stall/
    - assets/images/stove/
    - assets/images/icons/
    - assets/images/topping/
    - assets/images/skills/
    # Extra art from 이미지/이미지 raw via tools/pixelize.py (stage 14).
    - assets/images/fx/
    - assets/images/event/
    - assets/images/ui/
    - assets/images/cook/
    # Stall decorations from 추가 생성 이미지 (tools/apply_extra_art.py).
    - assets/images/deco/
    # Vendor parts cut from the concept sheets (tools/concept_avatar.py).
    - assets/images/avatar/girl/
    - assets/images/avatar/boy/
    # Eye and mouth frames laid over the vendor's face (tools/avatar_layers.py).
    - assets/images/parts/
